version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: auctor-postgres
    environment:
      POSTGRES_DB: definition
      POSTGRES_USER: definition
      POSTGRES_PASSWORD: definition
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U definition"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    ports:
      - "6379:6379" # Maps host port 6379 to container port 6379

      
  definition-service:
    build: ./services/definition-service
    ports:
      - "8081:8081"
      - "9090:9090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/definition
      - SPRING_DATASOURCE_USERNAME=definition
      - SPRING_DATASOURCE_PASSWORD=definition
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy

  execution-service:
    build: ./services/execution-service
    ports:
      - "8082:8082"
    environment:
      - EXECUTION_DB_URL=jdbc:postgresql://postgres:5432/execution
      - EXECUTION_DB_USER=execution
      - EXECUTION_DB_PASSWORD=execution
      - EXECUTION_GRPC_HOST=definition-service
      - EXECUTION_GRPC_PORT=9090
      - EXECUTION_REDIS_URL=redis://redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - definition-service
      - postgres

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_OTEL_EXPORTER_ENDPOINT=http://localhost:4318/v1/traces
    depends_on:
      - execution-service

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres_data: