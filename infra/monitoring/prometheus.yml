global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Load alerting rules
rule_files:
  - "prometheus-alerts.yml"

# Alertmanager configuration (configure as needed)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: "definition-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["definition-service:8081"]

  - job_name: "execution-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["execution-service:8082"]
  
  - job_name: "otel-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["otel-collector:8888"]
