global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "definition-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["definition-service:8081"]

  - job_name: "execution-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["execution-service:8082"]
