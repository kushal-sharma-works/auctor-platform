apiVersion: v1
kind: Service
metadata:
  name: execution-service
spec:
  type: ClusterIP
  selector:
    app: execution-service
  ports:
    - port: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: definition-service
spec:
  type: ClusterIP
  selector:
    app: definition-service
  ports:
    - port: 8081
      targetPort: 8081
      name: tomcat
    - port: 9090
      targetPort: 9090
      name: grpc
