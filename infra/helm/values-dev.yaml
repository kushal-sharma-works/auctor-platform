replicaCount: 1
environment: dev
logLevel: DEBUG

ingress:
  host: "auctor-dev.local"
  enabled: true

hpa:
  execution:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "250m"
    memory: "256Mi"
