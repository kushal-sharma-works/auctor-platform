image:
  registry: "acr.azurecr.io"
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1
environment: dev
logLevel: INFO

services:
  definition:
    httpPort: 8081
    grpcPort: 9090
  execution:
    httpPort: 8082
  web:
    httpPort: 3000

config:
  otelExporterEndpoint: "http://otel-collector:4317"
  definition:
    datasourceUrl: "jdbc:postgresql://postgresql:5432/definition"
    datasourceUser: "definition"
    jwtIssuer: "auctor-auth"
    jwtAudience: "definition-service"
  execution:
    dbUrl: "jdbc:postgresql://postgresql:5432/execution"
    dbUser: "execution"
    redisUrl: "redis://redis:6379"
  web:
    otelExporterEndpoint: "http://localhost:4318/v1/traces"
    definitionServiceUrl: "http://definition-service:8081"
    executionServiceUrl: "http://execution-service:8082"
    googleClientId: ""

secrets:
  definitionDbPassword: "definition"
  executionDbPassword: "execution"
  definitionJwtSecret: "change-me"
  executionJwtSecret: ""
  auctorJwtSecret: ""

ingress:
  enabled: true
  className: nginx
  host: "auctor.example.com"
  annotations: {}
  tls:
    enabled: false
    secretName: ""

hpa:
  definition:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  execution:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  web:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "250m"
    memory: "256Mi"