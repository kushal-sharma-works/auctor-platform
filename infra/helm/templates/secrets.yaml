{{- if ne .Values.environment "dev" }}
{{- /* Intentional: chart enforces non-default/non-empty values as a baseline. */}}
{{- /* Secret complexity/rotation policies are expected to be enforced by enterprise secret management (e.g., Key Vault policy) in production. */}}
{{- if or (eq .Values.secrets.definitionDbPassword "definition") (empty .Values.secrets.definitionDbPassword) }}
{{- fail "secrets.definitionDbPassword must be set to a non-default value for non-dev environments" }}
{{- end }}
{{- if or (eq .Values.secrets.executionDbPassword "execution") (empty .Values.secrets.executionDbPassword) }}
{{- fail "secrets.executionDbPassword must be set to a non-default value for non-dev environments" }}
{{- end }}
{{- if or (eq .Values.secrets.definitionJwtSecret "change-me") (empty .Values.secrets.definitionJwtSecret) }}
{{- fail "secrets.definitionJwtSecret must be set to a non-default value for non-dev environments" }}
{{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auctor.fullname" . }}-secrets
  labels:
    {{- include "auctor.labels" (dict "context" . "name" "secrets") | nindent 4 }}
# IMPORTANT: For production, use Azure Key Vault with CSI driver instead of inline secrets
# 1. Install: helm install csi-secrets-store-provider-azure csi-secrets-store-provider-azure/csi-secrets-store-provider-azure
# 2. Create SecretProviderClass referencing your Key Vault
# 3. Mount secrets as volumes in pod specs
# See: https://azure.github.io/secrets-store-csi-driver-provider-azure/docs/
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "{{ .Values.secrets.definitionDbPassword }}"
  EXECUTION_DB_PASSWORD: "{{ .Values.secrets.executionDbPassword }}"
  DEFINITION_JWT_SECRET: "{{ .Values.secrets.definitionJwtSecret }}"
  EXECUTION_JWT_SECRET: "{{ .Values.secrets.executionJwtSecret | default .Values.secrets.definitionJwtSecret }}"
  AUCTOR_JWT_SECRET: "{{ .Values.secrets.auctorJwtSecret | default .Values.secrets.definitionJwtSecret }}"
