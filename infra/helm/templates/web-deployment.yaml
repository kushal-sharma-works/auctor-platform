apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auctor.serviceName" (dict "context" . "name" "web") }}
  labels:
    {{- include "auctor.labels" (dict "context" . "name" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "auctor.selectorLabels" (dict "context" . "name" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auctor.selectorLabels" (dict "context" . "name" "web") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "auctor.serviceName" (dict "context" . "name" "web") }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "auctor.selectorLabels" (dict "context" . "name" "web") | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/web:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - containerPort: {{ .Values.services.web.httpPort }}
              name: http
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "auctor.fullname" . }}-config
                  key: ENVIRONMENT
            - name: NEXT_PUBLIC_OTEL_EXPORTER_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "auctor.fullname" . }}-config
                  key: NEXT_PUBLIC_OTEL_EXPORTER_ENDPOINT
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.services.web.httpPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.services.web.httpPort }}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
