apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auctor.serviceName" (dict "context" . "name" "definition-service") }}
  labels:
    {{- include "auctor.labels" (dict "context" . "name" "definition-service") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "auctor.selectorLabels" (dict "context" . "name" "definition-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auctor.selectorLabels" (dict "context" . "name" "definition-service") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "auctor.serviceName" (dict "context" . "name" "definition-service") }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "auctor.selectorLabels" (dict "context" . "name" "definition-service") | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: definition-service
          image: "{{ .Values.image.registry }}/definition-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - containerPort: {{ .Values.services.definition.httpPort }}
              name: http
            - containerPort: {{ .Values.services.definition.grpcPort }}
              name: grpc
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "auctor.fullname" . }}-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "auctor.fullname" . }}-config
                  key: LOG_LEVEL
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "auctor.fullname" . }}-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "auctor.fullname" . }}-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "auctor.fullname" . }}-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: DEFINITION_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "auctor.fullname" . }}-secrets
                  key: DEFINITION_JWT_SECRET
            - name: DEFINITION_JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "auctor.fullname" . }}-config
                  key: DEFINITION_JWT_ISSUER
            - name: DEFINITION_JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "auctor.fullname" . }}-config
                  key: DEFINITION_JWT_AUDIENCE
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "auctor.fullname" . }}-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.services.definition.httpPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.services.definition.httpPort }}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
