apiVersion: apps/v1
kind: Deployment
metadata:
  name: definition-service
  labels:
    app: definition-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: definition-service
  template:
    metadata:
      labels:
        app: definition-service
    spec:
      containers:
        - name: definition
          image: "{{ .Values.image.registry }}/definition-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8081
              name: tomcat
            - containerPort: 9090
              name: grpc
          env:
            - name: ENVIRONMENT
              value: "{{ .Values.environment }}"
            - name: LOG_LEVEL
              value: "{{ .Values.logLevel }}"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
