apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "auctor.serviceName" (dict "context" . "name" "definition-service") }}
  labels:
    {{- include "auctor.labels" (dict "context" . "name" "definition-service") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "auctor.serviceName" (dict "context" . "name" "execution-service") }}
  labels:
    {{- include "auctor.labels" (dict "context" . "name" "execution-service") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "auctor.serviceName" (dict "context" . "name" "web") }}
  labels:
    {{- include "auctor.labels" (dict "context" . "name" "web") | nindent 4 }}
automountServiceAccountToken: false

{{- if .Values.rbac.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "auctor.fullname" . }}-role
  labels:
    {{- include "auctor.labels" (dict "context" . "name" "rbac") | nindent 4 }}
rules:
{{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "auctor.fullname" . }}-rolebinding
  labels:
    {{- include "auctor.labels" (dict "context" . "name" "rbac") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "auctor.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "auctor.serviceName" (dict "context" . "name" "definition-service") }}
  - kind: ServiceAccount
    name: {{ include "auctor.serviceName" (dict "context" . "name" "execution-service") }}
  - kind: ServiceAccount
    name: {{ include "auctor.serviceName" (dict "context" . "name" "web") }}
{{- end }}
