apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auctor.serviceName" (dict "context" . "name" "otel-collector") }}
  labels:
    {{- include "auctor.labels" (dict "context" . "name" "otel-collector") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "auctor.selectorLabels" (dict "context" . "name" "otel-collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auctor.selectorLabels" (dict "context" . "name" "otel-collector") | nindent 8 }}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.93.0
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics
            - containerPort: 13133
              name: health
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: {{ include "auctor.fullname" . }}-otel-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "auctor.serviceName" (dict "context" . "name" "otel-collector") }}
  labels:
    {{- include "auctor.labels" (dict "context" . "name" "otel-collector") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
    - port: 8888
      targetPort: 8888
      name: metrics
  selector:
    {{- include "auctor.selectorLabels" (dict "context" . "name" "otel-collector") | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auctor.fullname" . }}-otel-config
  labels:
    {{- include "auctor.labels" (dict "context" . "name" "otel-collector") | nindent 4 }}
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
      resource:
        attributes:
          - key: service.namespace
            value: {{ .Release.Namespace }}
            action: insert
          - key: deployment.environment
            value: {{ .Values.environment }}
            action: insert
    
    exporters:
      logging:
        loglevel: info
      otlp:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8888"
    
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [logging, otlp]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [logging, prometheus]
