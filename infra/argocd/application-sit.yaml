apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auctor-sit
  namespace: argocd
spec:
  project: auctor
  source:
    repoURL: https://github.com/kushal-sharma-works/auctor-platform
    path: infra/helm
    targetRevision: main
    helm:
      valueFiles:
        - values-sit.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: auctor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
