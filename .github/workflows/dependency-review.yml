name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths:
      - '**/pom.xml'
      - '**/build.gradle'
      - '**/build.gradle.kts'
      - '**/settings.gradle'
      - '**/settings.gradle.kts'
      - '**/gradle.properties'
      - '**/gradle/libs.versions.toml'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/npm-shrinkwrap.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4