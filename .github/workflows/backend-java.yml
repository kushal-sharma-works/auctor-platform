name: Backend – Java (Spring Boot)

on:
  push:
    paths:
      - "services/definition-service/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        working-directory: services/definition-service
        run: mvn -q -DskipTests package
