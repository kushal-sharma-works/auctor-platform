name: Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: TruffleHog Secret Scan (PR range)
        uses: trufflesecurity/trufflehog@v3.93.4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      - name: TruffleHog Secret Scan (push range)
        uses: trufflesecurity/trufflehog@v3.93.4
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before != github.sha }}
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}

      - name: TruffleHog Secret Scan (full branch fallback)
        uses: trufflesecurity/trufflehog@v3.93.4
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && (github.event.before == '0000000000000000000000000000000000000000' || github.event.before == github.sha)) }}
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}

  code-quality:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=kushal-sharma-works
            -Dsonar.projectKey=kushal-sharma-works_auctor-platform
      - name: SonarCloud Scan skipped
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN not set; skipping SonarCloud scan."
