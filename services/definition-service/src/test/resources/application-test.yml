spring:
  application:
    name: definition-service-test
  
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:tc:postgresql:15:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 0

grpc:
  server:
    port: 0

logging:
  level:
    root: INFO
    com.auctor: DEBUG
