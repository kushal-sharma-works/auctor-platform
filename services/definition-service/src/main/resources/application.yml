spring:
  application:
    name: definition-service
  
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/definition
    username: definition
    password: definition
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  graphql:
    graphiql:
      enabled: true
    path: /graphql
    schema:
      printer:
        enabled: true

server:
  port: 8081

grpc:
  server:
    port: 9090
    enable-keep-alive: true
    reflection:
      enabled: true

logging:
  level:
    net.devh.boot.grpc.server: DEBUG
    net.devh.boot.grpc: DEBUG
    io.grpc: DEBUG
    root: INFO


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      service: definition-service
  tracing:
    enabled: true
    sampling:
      probability: 1.0

# OpenTelemetry configuration
# Using 'logging' exporter for development (traces go to console)
# To send traces to a collector, change to:
#   traces:
#     exporter: otlp
#   exporter:
#     otlp:
#       endpoint: http://localhost:4317
otel:
  sdk:
    disabled: false
  traces:
    exporter: logging
  logs:
    exporter: none
  metrics:
    exporter: none
  resource:
    attributes:
      service.name: definition-service
