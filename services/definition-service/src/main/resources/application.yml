spring:
  application:
    name: definition-service

  datasource:
    url: jdbc:postgresql://localhost:5432/definition
    username: definition
    password: definition
  
  jpa:
    hibernate:
      ddl-auto: validate  # Changed back to validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: true  # Re-enabled
    baseline-on-migrate: true

server:
  port: 8081

grpc:
  server:
    port: 9090
    enable-keep-alive: true
    reflection:
      enabled: true

logging:
  level:
    net.devh.boot.grpc.server: DEBUG
    net.devh.boot.grpc: DEBUG
    io.grpc: DEBUG
    root: INFO