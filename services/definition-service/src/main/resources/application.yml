spring:
  application:
    name: definition-service

  datasource:
    url: jdbc:postgresql://localhost:5432/definition
    username: definition
    password: definition
  
  jpa:
    hibernate:
      ddl-auto: validate  # Changed back to validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: true  # Re-enabled
    baseline-on-migrate: true

server:
  port: 8081

grpc:
  server:
    port: 9090
    enable-keep-alive: true
    reflection:
      enabled: true

logging:
  level:
    net.devh.boot.grpc.server: DEBUG
    net.devh.boot.grpc: DEBUG
    io.grpc: DEBUG
    root: INFO


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      service: definition-service
  tracing:
    enabled: true
    sampling:
      probability: 1.0

# OpenTelemetry configuration
# Using 'logging' exporter for development (traces go to console)
# To send traces to a collector, change to:
#   traces:
#     exporter: otlp
#   exporter:
#     otlp:
#       endpoint: http://localhost:4317
otel:
  sdk:
    disabled: false
  traces:
    exporter: logging
  logs:
    exporter: none
  metrics:
    exporter: none
  resource:
    attributes:
      service.name: definition-service
