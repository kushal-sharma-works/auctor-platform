spring:
  application:
    name: definition-service
  
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/definition
    username: definition
    password: definition
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

grpc:
  server:
    port: 9090
    enable-keep-alive: true
    reflection:
      enabled: true

logging:
  level:
    net.devh.boot.grpc.server: DEBUG
    net.devh.boot.grpc: DEBUG
    io.grpc: DEBUG
    root: INFO

security:
  jwt:
    secret: ${DEFINITION_JWT_SECRET:dev-secret-change-later-dev-secret-change-later}
    issuer: ${DEFINITION_JWT_ISSUER:auctor-auth}
    audience: ${DEFINITION_JWT_AUDIENCE:definition-service}
    jwks-uri: ${DEFINITION_JWT_JWKS_URI:}


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: db
  metrics:
    tags:
      service: definition-service
  tracing:
    enabled: true
    sampling:
      probability: 1.0

# OpenTelemetry configuration
# Using 'logging' exporter for development (traces go to console)
# To send traces to a collector, change to:
#   traces:
#     exporter: otlp
#   exporter:
#     otlp:
#       endpoint: http://localhost:4317
otel:
  sdk:
    disabled: false
  traces:
    exporter: otlp
  logs:
    exporter: none
  metrics:
    exporter: none
  resource:
    attributes:
      service.name: definition-service
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
